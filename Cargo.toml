[workspace]
members = ["universal-scanner", "uscan"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "LGPL-3.0"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
tokio-util = "0.7"
socket2 = "0.5"
if-addrs = "0.15"
ipnet = "2"
pcap = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
owo-colors = "4"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
